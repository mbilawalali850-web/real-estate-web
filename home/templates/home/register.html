{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <link rel="shortcut icon" href="{% static favicon %}" type="image/x-icon">
    <title>{{title}}</title>
</head>

<body>
    <div class="container">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <h2 style="color: #D1A748;">Register</h2>
            {% for message in messages %}
                <div class="alert alert-info" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
            <hr>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">First Name</label>
                <input type="text" class="form-control" name="first_name" id="exampleInputEmail1" aria-describedby="emailHelp" autocomplete="given-name">
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Last Name</label>
                <input type="text" class="form-control" name="last_name" id="exampleInputEmail1" aria-describedby="emailHelp" autocomplete="family-name">
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" name="email" id="exampleInputEmail1" placeholder="abc@examle.com" aria-describedby="emailHelp" autocomplete="email">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="input-group">
                <input type="password" class="form-control password" name="password" placeholder="Password" aria-label="Username">
                <span class="input-group-text"><i class="fa-regular fa-eye eye-icon"></i></span>
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" aria-label="Server">
            </div>
            <div class="mt-2">
                <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
            </div>
            <div class="btns-box">
            <button type="submit" class="btn-solid theme-primary submit-btn btns"><i class="fa-regular fa-paper-plane"></i> Submit</button>
            <a href="{% url 'dash' %}"><button type="button" class="back-btn btns"><i class="fa-solid fa-house"></i> Back to home</button></a>
        </div>
        </form>

    </div>
    <script src="{% static 'js/auth.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
